e22", "from": "E1", "to": "syn:1+5", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E5", "to": "syn:1+5", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "syn:1+5", "to": "E7", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E2", "to": "syn:2+3", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E3", "to": "syn:2+3", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "syn:2+3", "to": "E5", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E3", "to": "syn:3+9", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E9", "to": "syn:3+9", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "syn:3+9", "to": "E5", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E5", "to": "syn:5+8", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E8", "to": "syn:5+8", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "syn:5+8", "to": "E9", "width": 2}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E4", "label": "provides MisP (MisP)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E4 provides \u0027MisP (MisP)\u0027 to E3", "to": "E3", "width": 1.5}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E5", "label": "provides MisP (MisP)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E5 provides \u0027MisP (MisP)\u0027 to E3", "to": "E3", "width": 1.5}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E5", "label": "provides Hsp90 (Hsp90)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E5 provides \u0027Hsp90 (Hsp90)\u0027 to E2", "to": "E2", "width": 1.5}]);
