        <div class="card" style="width: 100%">

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#27ae60", "id": "E4", "label": "E4", "level": 0, "shape": "dot", "size": 22, "title": "E4  size=2  persistent=False\u003cbr\u003especies: [\u0027Ste11Ubi (Ste11Ubi)\u0027, \u0027p (p)\u0027]\u003cbr\u003ereq: [\u0027Ste11Ubi (Ste11Ubi)\u0027]\u003cbr\u003ewhy shown: explicit generator member"}, {"color": "#f1c40f", "id": "E5", "label": "E5", "level": 1, "shape": "dot", "size": 28, "title": "E5  size=5  persistent=False\u003cbr\u003especies: [\u0027Gbg (Gbg)\u0027, \u0027Ste11Ubi (Ste11Ubi)\u0027, \u0027Ste5 (Ste5)\u0027, \u0027Ste5Ste11GbgP (Ste5Ste11GbgP)\u0027, \u0027p (p)\u0027]\u003cbr\u003ereq: [\u0027Ste5 (Ste5)\u0027, \u0027Ste5Ste11GbgP (Ste5Ste11GbgP)\u0027]\u003cbr\u003ewhy shown: produces \u0027Ste11Ubi (Ste11Ubi)\u0027, which E4 (in the closure) requires"}, {"color": "#f1c40f", "id": "E14", "label": "E14", "level": 1, "shape": "dot", "size": 30, "title": "E14  size=6  persistent=False\u003cbr\u003especies: [\u0027Kss1 (Kss1)\u0027, \u0027Kss1PP (Kss1PP)\u0027, \u0027Ste11 (Ste11)\u0027, \u0027Ste11P (Ste11P)\u0027, \u0027Ste11Ubi (Ste11Ubi)\u0027, \u0027p (p)\u0027]\u003cbr\u003ereq: [\u0027Kss1 (Kss1)\u0027]\u003cbr\u003ewhy shown: produces \u0027Ste11Ubi (Ste11Ubi)\u0027, which E4 (in the closure) requires"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#7f8c8d", "font": {"color": "#7f8c8d", "size": 12}, "from": "E4", "label": "\u2282", "title": "E4 \u2282 E5  (E4 is contained in E5)", "to": "E5", "width": 2}, {"arrows": "to", "color": "#7f8c8d", "font": {"color": "#7f8c8d", "size": 12}, "from": "E4", "label": "\u2282", "title": "E4 \u2282 E14  (E4 is contained in E14)", "to": "E14", "width": 2}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E5", "label": "provides Ste11Ubi (Ste11Ubi)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E5 provides \u0027Ste11Ubi (Ste11Ubi)\u0027 to E4", "to": "E4", "width": 1.5}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E14", "label": "provides Ste11Ubi (Ste11Ubi)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E14 provides \u0027Ste11Ubi (Ste11Ubi)\u0027 to E4", "to": "E4", "width": 1.5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": false}, "layout": {"hierarchical": {"enabled": true, "direction": "DU", "sortMethod": "hubsize", "levelSeparation": 140, "nodeSpacing": 110}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
