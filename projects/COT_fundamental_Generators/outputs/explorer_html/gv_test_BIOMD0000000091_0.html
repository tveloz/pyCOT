        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#27ae60", "id": "E0", "label": "E0", "level": 0, "shape": "dot", "size": 20, "title": "E0  size=1  persistent=False\u003cbr\u003especies: [\u0027ROS (ROS)\u0027]\u003cbr\u003ereq: [\u0027ROS (ROS)\u0027]\u003cbr\u003ewhy shown: explicit generator member"}, {"color": "#f1c40f", "id": "E4", "label": "E4", "level": 1, "shape": "dot", "size": 26, "title": "E4  size=4  persistent=False\u003cbr\u003especies: [\u0027AggP (AggP)\u0027, \u0027MisP (MisP)\u0027, \u0027NatP (NatP)\u0027, \u0027ROS (ROS)\u0027]\u003cbr\u003ereq: [\u0027NatP (NatP)\u0027]\u003cbr\u003ewhy shown: produces \u0027ROS (ROS)\u0027, which E0 (in the closure) requires"}, {"color": "#f1c40f", "id": "E7", "label": "E7", "level": 2, "shape": "dot", "size": 32, "title": "E7  size=7  persistent=True\u003cbr\u003especies: [\u0027ADP (ADP)\u0027, \u0027ATP (ATP)\u0027, \u0027AggP (AggP)\u0027, \u0027Hsp90 (Hsp90)\u0027, \u0027MCom (MCom)\u0027, \u0027MisP (MisP)\u0027, \u0027NatP (NatP)\u0027]\u003cbr\u003ereq: []\u003cbr\u003ewhy shown: fundamental synergy with E0 (in the closure) -\u003e E4"}, {"color": "#e67e22", "id": "syn:0+7", "label": "+", "level": -1, "shape": "diamond", "size": 12, "title": "fundamental synergy: E0 + E7 -\u003e E4"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#7f8c8d", "font": {"color": "#7f8c8d", "size": 12}, "from": "E0", "label": "\u2282", "title": "E0 \u2282 E4  (E0 is contained in E4)", "to": "E4", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E0", "to": "syn:0+7", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "E7", "to": "syn:0+7", "width": 2}, {"arrows": "to", "color": "#e67e22", "from": "syn:0+7", "to": "E4", "width": 2}, {"arrows": "to", "color": "#2980b9", "dashes": true, "from": "E4", "label": "provides ROS (ROS)", "smooth": {"roundness": 0.2, "type": "curvedCW"}, "title": "E4 provides \u0027ROS (ROS)\u0027 to E0", "to": "E0", "width": 1.5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": false}, "layout": {"hierarchical": {"enabled": true, "direction": "DU", "sortMethod": "hubsize", "levelSeparation": 140, "nodeSpacing": 110}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
